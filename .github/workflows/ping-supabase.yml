name: Ping Supabase to Prevent Pausing

on:
  schedule:
    # Runs at 9:00 AM UTC every Monday and Thursday
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js --force

      - name: Ping Supabase Databases
        env:
          SUPABASE_CONFIGS: ${{ secrets.SUPABASE_CONFIGS }}
        run: |
          node -e "
          (async () => {
            try {
              const { createClient } = require('@supabase/supabase-js');
              
              if (!process.env.SUPABASE_CONFIGS) {
                throw new Error('Missing SUPABASE_CONFIGS secret. Please add it in GitHub Settings.');
              }

              const configs = JSON.parse(process.env.SUPABASE_CONFIGS);
              
              if (!Array.isArray(configs) || configs.length === 0) {
                throw new Error('SUPABASE_CONFIGS must be a non-empty array of database configurations');
              }

              console.log('Pinging', configs.length, 'database(s)...');
              console.log('Timestamp:', new Date().toISOString());
              console.log('-'.repeat(60));
              
              let successCount = 0;
              let failCount = 0;

              for (let i = 0; i < configs.length; i++) {
                const config = configs[i];
                const dbName = config.name || 'Database ' + (i + 1);
                
                try {
                  console.log('\n[' + (i + 1) + '/' + configs.length + '] ' + dbName);
                  console.log('URL:', config.url);
                  
                  if (!config.url || !config.key) {
                    throw new Error('Missing url or key for ' + dbName);
                  }

                  const supabase = createClient(config.url, config.key);

                  const startTime = Date.now();
                  const response = await fetch(config.url + '/rest/v1/', {
                    headers: {
                      'apikey': config.key,
                      'Authorization': 'Bearer ' + config.key
                    }
                  });
                  const duration = Date.now() - startTime;

                  if (!response.ok && response.status !== 404 && response.status !== 401) {
                    throw new Error('Server returned status ' + response.status);
                  }
                  
                  console.log('Success! Response time:', duration + 'ms');
                  successCount++;
                  
                } catch (err) {
                  console.error('Failed:', err.message);
                  failCount++;
                }
              }

              console.log('\n' + '-'.repeat(60));
              console.log('Summary:');
              console.log('  Successful:', successCount);
              console.log('  Failed:', failCount);
              console.log('  Total:', configs.length);
              
              if (failCount > 0) {
                console.error('\nSome databases failed to ping');
                process.exit(1);
              }
              
              console.log('\nAll databases pinged successfully!');
              
            } catch (err) {
              console.error('\nFatal error:', err.message);
              console.error('Make sure SUPABASE_CONFIGS is set as a JSON array:');
              console.error('[{\"name\":\"My DB\",\"url\":\"https://xxx.supabase.co\",\"key\":\"your-key\"}]');
              process.exit(1);
            }
          })();
          "

      - name: Notify Slack (success)
        if: ${{ success() }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"✅ Supabase keepalive succeeded for *${{ github.repository }}* (run #${{ github.run_number }}). <${RUN_URL}|View run logs>\"}" \
            "https://hooks.slack.com/services/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"

      - name: Notify Slack (failure)
        if: ${{ failure() }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"❌ Supabase keepalive failed for *${{ github.repository }}* (run #${{ github.run_number }}). <${RUN_URL}|View run logs>\"}" \
            "https://hooks.slack.com/services/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"
