name: Ping Supabase to Prevent Pausing

on:
  schedule:
    # Run twice daily away from the top of the hour to reduce scheduler drops.
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Ping Supabase Databases
        id: ping
        env:
          SUPABASE_CONFIGS: ${{ secrets.SUPABASE_CONFIGS }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const REQUEST_TIMEOUT_MS = 15000;
          const MAX_RETRIES = 3;
          const RETRY_DELAY_MS = 5000;

          function setOutput(name, value) {
          if (!process.env.GITHUB_OUTPUT) return;
          const safe = String(value ?? "").replace(/\r?\n/g, " ");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${safe}\n`);
          }

          function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function pingConfig(config, index, total) {
          const dbName = config.name || `Database ${index + 1}`;
          const url = String(config.url || "").replace(/\/$/, "");
          const key = config.key;

          if (!url || !key) {
          throw new Error(`Missing url or key for ${dbName}`);
          }

          const endpoint = `${url}/rest/v1/`;
          let lastError = null;

          for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
          try {
          console.log(`\n[${index + 1}/${total}] ${dbName}`);
          console.log("URL:", url);
          console.log(`Attempt: ${attempt}/${MAX_RETRIES}`);

          const startTime = Date.now();
          const response = await fetch(endpoint, {
          method: "GET",
          headers: {
          apikey: key,
          Authorization: `Bearer ${key}`,
          "User-Agent": "github-actions-supabase-keepalive",
          Accept: "application/json"
          },
          signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS)
          });
          const duration = Date.now() - startTime;

          if (response.status >= 500) {
          throw new Error(`Server returned status ${response.status}`);
          }

          console.log(`Success! Status: ${response.status} Response time: ${duration}ms`);
          return;
          } catch (err) {
          lastError = err;
          console.error(`Attempt ${attempt} failed: ${err.message}`);

          if (attempt < MAX_RETRIES) {
          console.log(`Retrying in ${RETRY_DELAY_MS / 1000}s...`);
          await sleep(RETRY_DELAY_MS);
          }
          }
          }

          throw lastError || new Error(`Ping failed for ${dbName}`);
          }

          (async () => {
          let successCount = 0;
          let failCount = 0;
          let totalCount = 0;
          let projectList = "";

          try {
          if (!process.env.SUPABASE_CONFIGS) {
          throw new Error("Missing SUPABASE_CONFIGS secret. Please add it in GitHub Settings.");
          }

          const configs = JSON.parse(process.env.SUPABASE_CONFIGS);

          if (!Array.isArray(configs) || configs.length === 0) {
          throw new Error("SUPABASE_CONFIGS must be a non-empty array of database configurations.");
          }

          totalCount = configs.length;
          projectList = configs
            .map((config, index) => {
              const name = config.name || `Database ${index + 1}`;
              const url = String(config.url || "").replace(/\/$/, "");
              return `${name} - ${url}`;
            })
            .join(" | ");

          console.log("Pinging", totalCount, "database(s)...");
          console.log("Projects:", projectList);
          console.log("Timestamp:", new Date().toISOString());
          console.log("-".repeat(60));

          for (let i = 0; i < configs.length; i++) {
          try {
          await pingConfig(configs[i], i, configs.length);
          successCount++;
          } catch (err) {
          console.error("Failed:", err.message);
          failCount++;
          }
          }

          console.log("\n" + "-".repeat(60));
          console.log("Summary:");
          console.log("  Successful:", successCount);
          console.log("  Failed:", failCount);
          console.log("  Total:", totalCount);

          setOutput("success_count", successCount);
          setOutput("fail_count", failCount);
          setOutput("total_count", totalCount);
          setOutput("project_list", projectList);
          setOutput("error_message", "");

          if (failCount > 0) {
          process.exit(1);
          }

          console.log("\nAll databases pinged successfully!");
          } catch (err) {
          console.error("\nFatal error:", err.message);
          console.error("Make sure SUPABASE_CONFIGS is set as a JSON array:");
          console.error('[{"name":"My DB","url":"https://xxx.supabase.co","key":"your-key"}]');

          setOutput("success_count", successCount);
          setOutput("fail_count", failCount);
          setOutput("total_count", totalCount);
          setOutput("project_list", projectList);
          setOutput("error_message", err.message);

          process.exit(1);
          }
          })();
          NODE

      - name: Notify Slack
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          SUCCESS_COUNT: ${{ steps.ping.outputs.success_count }}
          FAIL_COUNT: ${{ steps.ping.outputs.fail_count }}
          TOTAL_COUNT: ${{ steps.ping.outputs.total_count }}
          PROJECT_LIST: ${{ steps.ping.outputs.project_list }}
          ERROR_MESSAGE: ${{ steps.ping.outputs.error_message }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set. Skipping Slack notification."
            exit 0
          fi

          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          export SHORT_SHA="${GITHUB_SHA::7}"
          export NOW_UTC="$(date -u '+%Y-%m-%d %H:%M:%SZ')"

          [ -z "$SUCCESS_COUNT" ] && export SUCCESS_COUNT="0"
          [ -z "$FAIL_COUNT" ] && export FAIL_COUNT="0"
          [ -z "$TOTAL_COUNT" ] && export TOTAL_COUNT="0"

          if [ "$EVENT_NAME" = "schedule" ] && [ -n "$EVENT_SCHEDULE" ]; then
            export TRIGGER="$EVENT_NAME ($EVENT_SCHEDULE)"
          else
            export TRIGGER="$EVENT_NAME"
          fi

          node <<'NODE'
          const fs = require("fs");

          function slackEscape(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }

          const jobStatus = process.env.JOB_STATUS || "failure";
          const emoji = jobStatus === "success" ? "✅" : "❌";
          const statusText = jobStatus === "success" ? "SUCCESS" : "FAILURE";
          const successCount = process.env.SUCCESS_COUNT || "0";
          const failCount = process.env.FAIL_COUNT || "0";
          const totalCount = process.env.TOTAL_COUNT || "0";
          const trigger = slackEscape(process.env.TRIGGER || process.env.EVENT_NAME || "unknown");
          const errorMessage = slackEscape(process.env.ERROR_MESSAGE || "");
          const projectEntries = (process.env.PROJECT_LIST || "")
            .split(" | ")
            .map((entry) => entry.trim())
            .filter(Boolean)
            .map((entry) => {
              const match = entry.match(/^(.*) - (https?:\/\/.*)$/);
              if (!match) return `• ${slackEscape(entry)}`;
              const name = slackEscape(match[1].trim());
              const url = match[2].trim();
              return `• *${name}*\n<${url}|${slackEscape(url)}>`;
            })
            .join("\n\n");

          const blocks = [
            {
              type: "header",
              text: { type: "plain_text", text: `${emoji} Supabase keepalive ${statusText}` }
            },
            {
              type: "section",
              fields: [
                { type: "mrkdwn", text: `*Repository:*\n\`${slackEscape(process.env.GITHUB_REPOSITORY)}\`` },
                { type: "mrkdwn", text: `*Workflow:*\n\`${slackEscape(process.env.GITHUB_WORKFLOW)}\`` },
                { type: "mrkdwn", text: `*Status:*\n${statusText}` },
                { type: "mrkdwn", text: `*Trigger:*\n\`${trigger}\`` },
                { type: "mrkdwn", text: `*Actor:*\n\`${slackEscape(process.env.GITHUB_ACTOR)}\`` },
                { type: "mrkdwn", text: `*Branch:*\n\`${slackEscape(process.env.GITHUB_REF_NAME)}\`` },
                { type: "mrkdwn", text: `*Commit:*\n<${process.env.COMMIT_URL}|\`${slackEscape(process.env.SHORT_SHA)}\`>` },
                { type: "mrkdwn", text: `*Ping Summary:*\n\`${successCount} ok / ${failCount} failed / ${totalCount} total\`` }
              ]
            },
            {
              type: "section",
              text: {
                type: "mrkdwn",
                text: `*Run:* <${process.env.RUN_URL}|#${slackEscape(process.env.GITHUB_RUN_NUMBER)} (attempt ${slackEscape(process.env.GITHUB_RUN_ATTEMPT)})>`
              }
            }
          ];

          if (projectEntries) {
            blocks.push({
              type: "section",
              text: { type: "mrkdwn", text: `*Projects hit:*\n\n${projectEntries}` }
            });
          }

          if (errorMessage) {
            blocks.push({
              type: "section",
              text: { type: "mrkdwn", text: `*Error:*\n${errorMessage}` }
            });
          }

          blocks.push({
            type: "context",
            elements: [
              { type: "mrkdwn", text: `Generated at ${slackEscape(process.env.NOW_UTC)}` }
            ]
          });

          fs.writeFileSync(
            "payload.json",
            JSON.stringify({
              text: `${emoji} Supabase keepalive ${statusText} for ${process.env.GITHUB_REPOSITORY}`,
              blocks
            })
          );
          NODE

          curl -sS -X POST -H "Content-type: application/json" --data @payload.json "$SLACK_WEBHOOK_URL"
